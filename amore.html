<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Per Emma ❤️</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(-45deg, #ff5f9e, #ff8acb, #ffb3d9, #ff5f9e);
    background-size: 400% 400%;
    animation: bgMove 12s ease infinite;
    color: white;
}

@keyframes bgMove {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}

.center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 10;
    padding: 0 15px;
}

h1 {
    font-size: 2.6em;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); }
}

p {
    font-size: 1.2em;
    max-width: 650px;
    min-height: 90px;
    margin: auto;
}

button {
    margin-top: 25px;
    padding: 14px 30px;
    font-size: 1.1em;
    border: none;
    border-radius: 40px;
    cursor: pointer;
    background: white;
    color: #ff4f81;
    box-shadow: 0 0 15px white;
}

button:active {
    transform: scale(1.1);
}

.heart {
    position: fixed;
    bottom: -30px;
    pointer-events: none;
    animation: floatUp linear forwards;
}

@keyframes floatUp {
    from { transform: translateY(0) scale(1); opacity: 1; }
    to { transform: translateY(-120vh) scale(1.6); opacity: 0; }
}

.final {
    display: none;
    font-size: 2em;
    margin-top: 25px;
    animation: glow 1.5s infinite alternate;
}

@keyframes glow {
    from { text-shadow: 0 0 10px white; }
    to { text-shadow: 0 0 25px #ffd1e8; }
}
</style>
</head>

<body>

<div class="center">
    <h1>❤️ Emma ❤️</h1>
    <p id="typewriter"></p>
    <button onclick="loveExplosion()">Tocca qui 💖</button>
    <div class="final" id="finalText">Ti amo 💕</div>
</div>

<script>
/* TESTO */
const text = "Ciccina mia, volevo solo dirti che sei la cosa più bella che mi sia mai capitata. So il momento difficile che stai vivendo, ma ricordati che per te ci sarò sempre. Ti amo tantissimissimo ❤️";
let i = 0;

function typeWriter() {
    if (i < text.length) {
        document.getElementById("typewriter").innerHTML += text.charAt(i);
        i++;
        setTimeout(typeWriter, 45);
    }
}
typeWriter();

/* CUORI */
function createHeart(x = Math.random()*window.innerWidth) {
    const h = document.createElement("div");
    h.className = "heart";
    h.innerHTML = "❤️";
    h.style.left = x + "px";
    h.style.fontSize = (18 + Math.random()*22) + "px";
    h.style.animationDuration = (4 + Math.random()*2) + "s";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),6000);
}

/* CUORI LENTI */
setInterval(() => {
    createHeart();
}, 700);

/* ESPLOSIONE */
function loveExplosion() {
    for(let j=0;j<25;j++){
        setTimeout(() => createHeart(Math.random()*window.innerWidth), j*80);
    }
    document.getElementById("finalText").style.display="block";
}

/* TOUCH + CLICK */
document.addEventListener("touchstart", e => {
    const x = e.touches[0].clientX;
    for(let k=0;k<6;k++){
        createHeart(x + Math.random()*40 - 20);
    }
});

document.addEventListener("click", e => {
    for(let k=0;k<6;k++){
        createHeart(e.clientX + Math.random()*40 - 20);
    }
});
</script>

</body>
</html>
